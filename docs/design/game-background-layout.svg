<path d="M390 0V844" stroke="#7b919c"/>
<text x="416" y="32" font-size="17" fill="#fff4d6">GAME BACKGROUND PLAN</text>
<text x="416" y="56" font-size="13" fill="#ced9dd">Schematic composition; not final artwork.</text>
<text x="416" y="80" font-size="13" fill="#ced9dd">Left: fixed 390 × 844 logical canvas.</text>
<text x="416" y="145" font-size="15" fill="#a8d8df">One continuous AI sea image</text>
<text x="416" y="168" font-size="13" fill="#ced9dd">Fills the entire canvas behind the UI.</text>
<text x="416" y="191" font-size="13" fill="#ced9dd">Master: 1560 × 3376 px; opaque PNG.</text>
<text x="416" y="225" font-size="13" fill="#ced9dd">Board environment: y = 128–496</text>
<text x="416" y="248" font-size="13" fill="#ced9dd">Dashed rectangle is a guide only.</text>
<text x="416" y="288" font-size="15" fill="#fff4d6">Playable island: existing terrain</text>
<text x="416" y="311" font-size="13" fill="#ced9dd">Center: (195, 312); hex radius: 38.</text>
<text x="416" y="334" font-size="13" fill="#ced9dd">Land bounds: 329.09 × 304 px.</text>
<text x="416" y="357" font-size="13" fill="#ced9dd">x = 30.46–359.54; y = 160–464.</text>
<text x="416" y="380" font-size="13" fill="#ced9dd">Each hex: 65.82 × 76 px.</text>
<text x="416" y="421" font-size="15" fill="#ead2a2">Coast follows actual outer edges</text>
<text x="416" y="444" font-size="13" fill="#ced9dd">Runtime stone/sand rim: 2–3 px.</text>
<text x="416" y="467" font-size="13" fill="#ced9dd">Shallow wash: up to 12–16 px outward.</text>
<text x="416" y="490" font-size="13" fill="#ced9dd">No coastline in the generated image.</text>
<text x="416" y="536" font-size="13" fill="#ced9dd">About 30 px side water before coast.</text>
<text x="416" y="559" font-size="13" fill="#ced9dd">32 px above and below land within</text>
<text x="416" y="582" font-size="13" fill="#ced9dd">the reserved board environment.</text>
<text x="416" y="632" font-size="15" fill="#fff4d6">Existing lower controls</text>
<text x="416" y="655" font-size="13" fill="#ced9dd">Water stays subtle behind the panels.</text>
<text x="416" y="678" font-size="13" fill="#ced9dd">Guide labels are English for planning;</text>
<text x="416" y="701" font-size="13" fill="#ced9dd">game UI remains runtime Persian text.</text>
<text x="416" y="758" font-size="15" fill="#fff4d6">Planned layout adjustments</text>
<text x="416" y="781" font-size="13" fill="#ced9dd">5% smaller tiles; center 10 px higher.</text>
<text x="416" y="804" font-size="13" fill="#ced9dd">Core board and rules stay authoritative.</text>
</g></svg>
